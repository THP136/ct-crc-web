name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Check admin token
        env:
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}
        run: |
          if [ -z "$VITE_ADMIN_TOKEN" ]; then
            echo "::error title=Missing VITE_ADMIN_TOKEN::Add the repository secret VITE_ADMIN_TOKEN with the same value as the Koyeb ADMIN_TOKEN."
            exit 1
          fi

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL || 'https://flaky-sacha-136leo-6c840edd.koyeb.app' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/ct-crc-web/' }}
          VITE_ADMIN_TOKEN: ${{ secrets.VITE_ADMIN_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
